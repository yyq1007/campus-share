    <!-- 尾巴 -->
    <path d="M84 92 c16 2 22-8 18-18 c-3-8-12-9-14-3" fill="#FFFFFF"/>
    <!-- 身体 -->
    <path d="M38 98 c-6-22-4-38 6-46 c8-6 26-6 34 0 c10 8 12 24 6 46 Z" fill="#FFFFFF"/>
    <!-- 头 -->
    <circle cx="60" cy="40" r="26" fill="#FFFFFF"/>
