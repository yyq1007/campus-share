<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 60 60">
  <!-- 四角星（sparkle）：1 单位 = 1rpx（元素 60×60rpx）
       整体 33×33rpx（臂长 R=14.8 + 描边 3.4/2），高度与宽度严格相等（旧版 33.6 宽 × 28.8 高，偏扁）。
       描边 3.4（1.7pt）比旧版 2.9 粗一档；透明度 0.25（旧版 0.55，设计稿实测约 0.24）。
       每段用二次贝塞尔：控制点放在对角线方向 C + 0.40R 处，尖端夹角 ~43°（够尖），
       腰部约 0.55R，凹边 + 中央菱形镂空与设计稿一致 -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19FAE1" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#30C2FC" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#g)" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- 大星：中心 (25, 22.6)，R=14.8 -->
    <path d="M 25.00 7.80 Q 29.19 18.41 39.80 22.60 Q 29.19 26.79 25.00 37.40 Q 20.81 26.79 10.20 22.60 Q 20.81 18.41 25.00 7.80 Z"/>
    <!-- 小星：中心 (45, 43.5)，R=7.4，描边 3.0（小尺寸略细一档，视觉重量对齐） -->
    <path d="M 45.00 36.10 Q 47.09 41.41 52.40 43.50 Q 47.09 45.59 45.00 50.90 Q 42.91 45.59 37.60 43.50 Q 42.91 41.41 45.00 36.10 Z" stroke-width="3.0"/>
  </g>
</svg>
