<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- 白色实心小猫（v4 设计稿 S1 页头插画）：圆润坐姿 + 粉腮红 -->
  <g fill="#FFFFFF">
    <!-- 耳朵 -->
    <path d="M32 44 L30 16 L54 31 Z"/>
    <path d="M88 44 L90 16 L66 31 Z"/>
    <!-- 身体（坐姿） -->
    <path d="M60 54 c20 0 28 16 28 32 c0 12 -9 18 -28 18 s-28 -6 -28 -18 c0 -16 8 -32 28 -32 z"/>
    <!-- 尾巴 -->
    <path d="M86 92 c10 -2 14 -10 12 -18 c-1 -5 -6 -7 -9 -4 c-3 3 -1 7 3 8 c4 1 6 4 4 8 c-2 4 -6 6 -10 6 z"/>
    <!-- 头 -->
    <circle cx="60" cy="50" r="29"/>
  </g>
  <!-- 腮红 -->
  <ellipse cx="37" cy="58" rx="7.5" ry="4.5" fill="#FFC2CB"/>
  <ellipse cx="83" cy="58" rx="7.5" ry="4.5" fill="#FFC2CB"/>
  <!-- 眼睛（弯月，笑眼） -->
  <path d="M45 49 q4.5 -5 9 0" stroke="#4A4458" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M66 49 q4.5 -5 9 0" stroke="#4A4458" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- 鼻子 + 嘴 -->
  <path d="M60 60 l-4.5 -3.5 h9 z" fill="#F4A7B4"/>
  <path d="M56 64 q4 4.5 8 0" stroke="#4A4458" stroke-width="2.6" fill="none" stroke-linecap="round"/>
</svg>
